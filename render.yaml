services:
  - type: web
    name: reconverge-2001
    runtime: node
    # Free tier — sleeps after 15 min of inactivity. Cold-start takes ~30–60s
    # for the first visitor. Data is NOT stored locally; it lives in the
    # Postgres DB on EC2 (see envVars below), so spin-downs are safe.
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres connection — hosted on a self-managed EC2 instance.
      # SECURITY: PGPASSWORD is committed to git for now per the project's
      # current deploy directive. Before a real public launch, convert
      # PGPASSWORD to a Render secret env var (dashboard → Environment →
      # "Add Secret File" or sync=false) and rotate the credential.
      - key: PGHOST
        value: ec2-3-90-186-32.compute-1.amazonaws.com
      - key: PGPORT
        value: 5432
      - key: PGUSER
        value: reconverge_app
      - key: PGPASSWORD
        value: RECCon@1234
      - key: PGDATABASE
        value: reconverge
      # Public origin used to build password-reset URLs sent by email.
      - key: APP_URL
        value: https://reconverge-2001.onrender.com
      # Transactional email via Resend. From-address must be at a Resend-
      # verified domain (reconverge.downstream-solutions.com). Reply-To is
      # optional — set it if you want alumni replies to land in a real inbox.
      - key: MAIL_FROM
        value: REConverge 2001 <noreply@reconverge.downstream-solutions.com>
      - key: MAIL_REPLY_TO
        value: crec2001reunion@gmail.com
      # SECRET — set from the Render dashboard, do NOT commit the value.
      - key: RESEND_API_KEY
        sync: false
